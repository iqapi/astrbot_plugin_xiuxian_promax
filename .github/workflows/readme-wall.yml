name: Update community widgets

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * *' # 每天 UTC+8 12:00 自动刷新
  workflow_dispatch:      # 支持手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate RepoScope visuals
        uses: liuchong/reposcope@v0.0.1
        with:
          branch: reposcope

      - name: Commit and push changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout reposcope || git checkout -b reposcope
          git add .
          git commit -m "docs: update repo visuals [skip ci]" || echo "No changes to commit"
          git push origin reposcope
