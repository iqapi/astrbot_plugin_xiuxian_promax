name: Update community widgets

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * *' # 每日 UTC+8 12 点自动刷新
  workflow_dispatch:      # 支持手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: santana-org/starmie@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          theme: dark        # 可选 white | dark，根据你的 README 风格选择
          output-dir: community # SVG 文件输出目录，可自定义
