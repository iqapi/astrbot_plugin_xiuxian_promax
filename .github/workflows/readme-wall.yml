name: Update community widgets

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * *' # 每天 UTC+8 12:00 刷新
  workflow_dispatch:

permissions:
  contents: write

jobs:
  visuals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate RepoScope visuals
        uses: liuchong/reposcope@v0.0.1
        with:
          branch: reposcope
